<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Chore Chart</title>
<link rel="stylesheet" href="chart.css">
</head>
<body>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>

  <div class="chart" id="chart"></div>

  <button class="secret-btn" id="secretBtn" aria-hidden="true" tabindex="-1"></button>
  <div class="progress" id="progress"></div>
  <button class="reset-btn" id="resetBtn"></button>
  <canvas id="fireworks-canvas"></canvas>
  <div class="celebrate-text" id="celebrateText"></div>

<script>
window.CHART = {
  title: '\u{1F31F} My Chore Chart \u{1F31F}',
  subtitle: "Tap a chore when it's done!",
  celebrate: '\u{1F389} All Done! \u{1F389}',
  resetLabel: 'Reset Day',
  sections: [
    {
      emoji: '\u{1F3E0}', label: 'At Home', counts: true,
      chores: [
        { key: 'breakfast',  emoji: '\u{1F963}', label: 'Breakfast' },
        { key: 'vitamins',   emoji: '\u{1F48A}', label: 'Vitamins' },
        { key: 'medicine',   emoji: '\u{1F944}', label: 'Morning Medicine', secret: true },
        { key: 'diaper',     emoji: '\u{1F9F7}', label: 'Diaper' },
        { key: 'clothes',    emoji: '\u{1F455}', label: 'Get Dressed' },
        { key: 'magicwater', emoji: '✨\u{1F4A7}', label: 'Magic Water' },
        { key: 'teeth',      emoji: '\u{1FAA5}', label: 'Brush Teeth' },
        { key: 'snack',      emoji: '\u{1F34E}', label: 'Make Snack' },
        { key: 'glasses',    emoji: '\u{1F453}', label: 'Glasses' },
        { key: 'shoes',      emoji: '\u{1F45F}', label: 'Shoes' },
        { key: 'outthedoor', emoji: '\u{1F6AA}', label: 'Out the Door' }
      ]
    },
    {
      emoji: '\u{1F68C}', label: 'After', counts: false,
      chores: [
        { key: 'school', emoji: '\u{1F3EB}', label: 'Go to School' }
      ]
    }
  ]
};
</script>
<script src="chart.js"></script>
</body>
</html>
