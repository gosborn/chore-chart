<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Chore Chart</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    box-sizing: border-box;
  }
  h1 {
    color: #4a3f6b;
    font-size: 28px;
    margin-bottom: 4px;
    text-align: center;
  }
  p.sub {
    color: #6b5f8f;
    margin-top: 0;
    margin-bottom: 20px;
  }
  .chart {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .chore {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    border-radius: 18px;
    padding: 16px 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, background 0.2s ease;
    border: 3px solid transparent;
  }
  .chore:active {
    transform: scale(0.97);
  }
  .chore.done {
    background: #fff8dc;
    border-color: #ffd93d;
  }
  .chore-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .emoji {
    font-size: 32px;
  }
  .label {
    font-size: 20px;
    font-weight: bold;
    color: #4a3f6b;
  }
  .chore.done .label {
    color: #b8860b;
  }
  .star {
    font-size: 34px;
    opacity: 0.15;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .chore.done .star {
    opacity: 1;
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .reset-btn {
    margin-top: 26px;
    background: #4a3f6b;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:active {
    transform: scale(0.96);
  }
  .progress {
    margin-top: 18px;
    font-size: 18px;
    color: #4a3f6b;
    font-weight: bold;
  }
  #fireworks-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
  }
  .celebrate-text {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 42px;
    font-weight: bold;
    color: #ff4d94;
    text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
    z-index: 1000;
    pointer-events: none;
    text-align: center;
  }
  .celebrate-text.show {
    animation: celebratePop 2.2s ease forwards;
  }
  @keyframes celebratePop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>🌟 My Chore Chart 🌟</h1>
  <p class="sub">Tap a chore when it's done!</p>

  <div class="chart" id="chart">
    <div class="chore" data-key="breakfast">
      <div class="chore-left"><span class="emoji">🥣</span><span class="label">Breakfast</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="vitamins">
      <div class="chore-left"><span class="emoji">💊</span><span class="label">Vitamins</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="diaper">
      <div class="chore-left"><span class="emoji">🧷</span><span class="label">Diaper</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="clothes">
      <div class="chore-left"><span class="emoji">👕</span><span class="label">Get Dressed</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="magicwater">
      <div class="chore-left"><span class="emoji">✨💧</span><span class="label">Magic Water</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="teeth">
      <div class="chore-left"><span class="emoji">🪥</span><span class="label">Brush Teeth</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="snack">
      <div class="chore-left"><span class="emoji">🍎</span><span class="label">Make Snack</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="glasses">
      <div class="chore-left"><span class="emoji">👓</span><span class="label">Glasses</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="shoes">
      <div class="chore-left"><span class="emoji">👟</span><span class="label">Shoes</span></div>
      <span class="star">⭐</span>
    </div>
    <div class="chore" data-key="school">
      <div class="chore-left"><span class="emoji">🏫</span><span class="label">Go to School</span></div>
      <span class="star">⭐</span>
    </div>
  </div>

  <div class="progress" id="progress">0 / 10 done</div>
  <button class="reset-btn" id="resetBtn">Reset Day</button>
  <canvas id="fireworks-canvas"></canvas>
  <div class="celebrate-text" id="celebrateText">🎉 All Done! 🎉</div>

<script>
  const chores = document.querySelectorAll('.chore');
  const progressEl = document.getElementById('progress');
  const canvas = document.getElementById('fireworks-canvas');
  const ctx = canvas.getContext('2d');
  const celebrateText = document.getElementById('celebrateText');
  let fireworksRunning = false;
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const colors = ['#ff4d94', '#ffd93d', '#4dd0ff', '#7cff4d', '#c94dff', '#ff884d'];

  function launchFirework() {
    const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
    const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const count = 45;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      const speed = 2 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color,
        size: 2 + Math.random() * 2
      });
    }
  }

  function animate() {
    if (!fireworksRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.alpha -= 0.012;
      ctx.globalAlpha = Math.max(p.alpha, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.alpha > 0);
    requestAnimationFrame(animate);
  }

  function startFireworks() {
    fireworksRunning = true;
    celebrateText.classList.remove('show');
    void celebrateText.offsetWidth;
    celebrateText.classList.add('show');
    animate();
    launchFirework();
    let bursts = 1;
    const interval = setInterval(() => {
      launchFirework();
      bursts++;
      if (bursts >= 8) clearInterval(interval);
    }, 350);
    setTimeout(() => {
      fireworksRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = [];
    }, 4500);
  }

  function updateProgress() {
    const done = document.querySelectorAll('.chore.done').length;
    progressEl.textContent = done + ' / ' + chores.length + ' done';
    if (done === chores.length) {
      startFireworks();
    }
  }

  chores.forEach(c => {
    c.addEventListener('click', () => {
      c.classList.toggle('done');
      updateProgress();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    chores.forEach(c => c.classList.remove('done'));
    updateProgress();
  });
</script>
</body>
</html>
